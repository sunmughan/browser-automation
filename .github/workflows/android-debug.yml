name: Android Release APK

on:
  push:
    branches:
      - main
      - implementation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build WebLibre-based Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout automation overlay repository
        uses: actions/checkout@v4

      - name: Checkout pinned WebLibre upstream
        run: |
          set -euo pipefail
          git clone https://github.com/FaFre/WebLibre.git upstream
          git -C upstream fetch --no-tags origin 8e802b6cb4804e41d081ec42b3c513bd10875844
          git -C upstream checkout --detach 8e802b6cb4804e41d081ec42b3c513bd10875844
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply debug overlay
        run: |
          set -euo pipefail
          cp -R overlay/apps/weblibre/lib/features/automation upstream/apps/weblibre/lib/features/
          python3 scripts/apply_overlay.py

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: false

      - name: Install Android NDK
        working-directory: upstream
        run: |
          set -euo pipefail
          NDK_VERSION="$(sed -n 's/^weblibre\.ndkVersion[[:space:]]*=[[:space:]]*//p' apps/weblibre/android/gradle.properties)"
          test -n "$NDK_VERSION"
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "::error::Android NDK installation failed with sdkmanager exit code $SDKMANAGER_STATUS"
            exit "$SDKMANAGER_STATUS"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Bootstrap Flutter workspace
        working-directory: upstream
        run: |
          set -euo pipefail
          dart pub global activate melos 7.8.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          melos bootstrap

      - name: Download and generate upstream browser assets
        working-directory: upstream
        run: melos run update-assets --no-select

      - name: Build browser components
        working-directory: upstream
        run: melos run build-components --no-select

      - name: Checkout pinned native runtime sources
        working-directory: upstream
        run: |
          set -euo pipefail
          source native/go_mobile_runtime/pins.env
          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          git -C "$RUNNER_TEMP/sing-box" checkout "$SING_BOX_TAG"
          test "$(git -C "$RUNNER_TEMP/sing-box" rev-parse HEAD)" = "$SING_BOX_COMMIT"
          git clone https://github.com/tladesignz/IPtProxy.git "$RUNNER_TEMP/IPtProxy"
          git -C "$RUNNER_TEMP/IPtProxy" checkout "$IPTPROXY_TAG"
          test "$(git -C "$RUNNER_TEMP/IPtProxy" rev-parse HEAD)" = "$IPTPROXY_COMMIT"
          git -C "$RUNNER_TEMP/IPtProxy" submodule update --init dnstt

      - name: Build native Android runtime
        working-directory: upstream
        env:
          SING_BOX_SOURCE: ${{ runner.temp }}/sing-box
          IPTPROXY_SOURCE: ${{ runner.temp }}/IPtProxy
        run: melos run build-go-runtime --no-select

      - name: Create CI-only signing key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-signing/ci-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=CI,C=US"
          echo "KEY_PATH=$RUNNER_TEMP/android-signing/ci-debug.keystore" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build arm64 release APK
        working-directory: upstream/apps/weblibre
        run: flutter build apk --release --flavor githubAlpha --target-platform android-arm64 --no-tree-shake-icons

      - name: Collect release APK and build diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          find upstream/apps/weblibre/build/app/outputs -type f -name '*.apk' -print -exec cp {} dist/ \; || true
          {
            echo "=== APK FILE SIZES ==="
            find dist -maxdepth 1 -type f -name '*.apk' -printf '%s %p\n' | sort -nr
            for apk in dist/*.apk; do
              [ -f "$apk" ] || continue
              echo
              echo "=== LARGEST APK ENTRIES: $(basename "$apk") ==="
              unzip -l "$apk" | sort -nr | head -45 || true
              echo
              echo "=== APK TOP-LEVEL CONTENT COUNTS ==="
              unzip -Z1 "$apk" | awk -F/ 'NF > 1 { group=$1 } { count[group]++ } END { for (group in count) print count[group], group }' | sort -nr | head -30
              echo
              echo "=== ARM64 NATIVE LIBRARIES ==="
              unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*\.so$' | sort -nr | head -40 || true
            done
          } > dist/apk-size-report.txt 2>&1
          {
            echo "Automation repository commit: $GITHUB_SHA"
            echo "WebLibre upstream commit: ${UPSTREAM_SHA:-unknown}"
            echo "Runner: $RUNNER_OS"
            echo "Flutter: $(flutter --version 2>&1 | head -1 || true)"
            echo "APK files:"
            find dist -maxdepth 1 -type f -name '*.apk' -printf '%f (%s bytes)\n' || true
          } > dist/build-info.txt
          if [ -d upstream/apps/weblibre/build ]; then
            find upstream/apps/weblibre/build -type f \( -name '*.log' -o -name '*.txt' \) -size -5M -print | head -100 > dist/build-log-index.txt || true
          fi

      - name: Upload release APK and build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-automation-release-apk
          path: dist/
          if-no-files-found: warn
          retention-days: 14
